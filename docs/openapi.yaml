openapi: 3.0.3
info:
  title: Yan KB API
  version: 1.2.0
  description: |
    Lean Express API for hasil pelayanan KB (family planning service results)
    by NIK from Postgres MV `sigabaru.mv_bnba_akseptor_2026`.

    Response is a single flat snake_case object for the latest layanan row.
    SIGA (`BKKBN_SIGA`) enriches `nama_pasangan` (`NamaSuami`) and
    `tanggal_cabut_lepas` (`TanggalJatuhTempo`). Empty/missing values are `"-"`.

    Call `/api/kb/*` with header `X-API-Key` matching env `API_KEY`.
    `GET /health` and `GET /api/docs` are public.
servers:
  - url: /
    description: Current host
tags:
  - name: health
    description: Liveness / readiness
  - name: kb
    description: KB akseptor lookup (X-API-Key required)
paths:
  /health:
    get:
      tags: [health]
      summary: Health check
      description: Public liveness probe with a Postgres ping.
      security: []
      responses:
        '200':
          description: Process up and DB reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthOk'
              example:
                status: ok
                db: up
        '503':
          description: Process up but DB unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDegraded'
              example:
                status: degraded
                db: down

  /api/kb/akseptor/{nik}:
    get:
      tags: [kb]
      summary: Get KB akseptor by NIK (path)
      description: |
        Returns one flat snake_case object (`nik` + biodata/layanan fields)
        from the latest layanan row for the NIK. Empty fields are `"-"`.
        NIK must be exactly 16 digits and must not be 16 identical digits
        (e.g. `0000000000000000` or `9999999999999999`).
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/NikPath'
      responses:
        '200':
          description: Akseptor found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AkseptorResponse'
              examples:
                sample:
                  $ref: '#/components/examples/AkseptorExample'
        '400':
          description: NIK tidak valid (kurang/lebih dari 16 digit, atau 16 digit sama)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                missing:
                  value:
                    error: NIK tidak valid
                    message: NIK wajib diisi dan harus tepat 16 digit angka
                invalidLength:
                  value:
                    error: NIK tidak valid
                    message: NIK harus tepat 16 digit angka
                identicalDigits:
                  value:
                    error: NIK tidak valid
                    message: >-
                      NIK tidak boleh 16 digit yang sama semua
                      (mis. 0000000000000000 atau 9999999999999999)
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Unauthorized
        '404':
          description: Data akseptor tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error: Tidak ditemukan
                message: Data akseptor untuk NIK tersebut tidak ditemukan
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Database query failed

  /api/kb/akseptor:
    get:
      tags: [kb]
      summary: Get KB akseptor by NIK (query)
      description: |
        Alias of path form. Pass `nik` as a query parameter (exactly 16
        digits, not all identical).
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/NikQuery'
      responses:
        '200':
          description: Akseptor found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AkseptorResponse'
              examples:
                sample:
                  $ref: '#/components/examples/AkseptorExample'
        '400':
          description: NIK tidak valid (kurang/lebih dari 16 digit, atau 16 digit sama)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                identicalDigits:
                  value:
                    error: NIK tidak valid
                    message: >-
                      NIK tidak boleh 16 digit yang sama semua
                      (mis. 0000000000000000 atau 9999999999999999)
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Unauthorized
        '404':
          description: Data akseptor tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error: Tidak ditemukan
                message: Data akseptor untuk NIK tersebut tidak ditemukan
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key matching env `API_KEY`

  parameters:
    NikPath:
      name: nik
      in: path
      required: true
      description: |
        Exactly 16 digits; rejected if all digits are the same character.
      schema:
        type: string
        pattern: '^\d{16}$'
        not:
          pattern: '^(\d)\1{15}$'
      example: '3202374707880005'
    NikQuery:
      name: nik
      in: query
      required: true
      description: |
        Exactly 16 digits; rejected if all digits are the same character.
      schema:
        type: string
        pattern: '^\d{16}$'
        not:
          pattern: '^(\d)\1{15}$'
      example: '3202374707880005'

  examples:
    AkseptorExample:
      summary: Sample flat snake_case akseptor response
      value:
        nik: '3202374707880005'
        nama_lengkap: ATIKAH
        tanggal_lahir: '1988-07-07'
        jenis_kelamin: '-'
        nama_pasangan: MUHAMMAD RAFIL
        asuransi: BPJS Kesehatan
        metode_kontrasepsi: '-'
        tanggal_pemakaian: '2026-09-29'
        tanggal_cabut_lepas: '-'

  schemas:
    HealthOk:
      type: object
      required: [status, db]
      properties:
        status:
          type: string
          enum: [ok]
        db:
          type: string
          enum: [up]

    HealthDegraded:
      type: object
      required: [status, db]
      properties:
        status:
          type: string
          enum: [degraded]
        db:
          type: string
          enum: [down]

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    ApiError:
      type: object
      required: [error, message]
      description: KB client error body (Indonesian `error` + explanatory `message`)
      properties:
        error:
          type: string
          description: Short error code/label
        message:
          type: string
          description: Human-readable explanation of the rule or outcome

    AkseptorResponse:
      type: object
      required:
        - nik
        - nama_lengkap
        - tanggal_lahir
        - jenis_kelamin
        - nama_pasangan
        - asuransi
        - metode_kontrasepsi
        - tanggal_pemakaian
        - tanggal_cabut_lepas
      properties:
        nik:
          type: string
          pattern: '^\d{16}$'
          description: Exactly 16 digits; never all identical
          example: '3202374707880005'
        nama_lengkap:
          type: string
          description: From MV `NamaPesertaKB` (latest layanan row)
          example: ATIKAH
        tanggal_lahir:
          type: string
          description: `YYYY-MM-DD` or `"-"`
          example: '1988-07-07'
        jenis_kelamin:
          type: string
          description: |
            From MV gender column if present; current MV has none → `"-"`.
          example: '-'
        nama_pasangan:
          type: string
          description: |
            From SIGA `NamaSuami` (latest non-empty). Missing/SIGA fail → `"-"`.
          example: MUHAMMAD RAFIL
        asuransi:
          type: string
          description: From MV `penggunaanasuransi`
          example: BPJS Kesehatan
        metode_kontrasepsi:
          type: string
          description: Prefer MV `jenisalokon`, else `jenistindakan`, else `"-"`
          example: Suntikan 1 Bulanan
        tanggal_pemakaian:
          type: string
          description: From MV `tanggalkb` as `YYYY-MM-DD` or `"-"`
          example: '2026-09-29'
        tanggal_cabut_lepas:
          type: string
          description: |
            From SIGA `TanggalJatuhTempo` (latest non-null for NIK) as
            `YYYY-MM-DD`, or `"-"`.
          example: '-'
